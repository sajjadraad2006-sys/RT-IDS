name: verification

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "2"
      CG_DB_PATH: ${{ runner.temp }}/cyberguard-ci.sqlite
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-constraints.txt

      - name: Install exact version-constrained dependencies with pip
        run: python -m pip install --requirement requirements-dev.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Regenerate and validate committed deterministic fixture
        run: |
          python -m cyberguard.datasets.generate_sample --check
          python -c "from backend.config import BASE_DIR; from backend.detection.integrity import validate_dataset_manifest; items = validate_dataset_manifest(BASE_DIR / 'cyberguard/datasets/manifest.json', BASE_DIR); assert len(items) == 1 and items[0]['training_approved'] is False"

      - name: Validate active artifact manifest without promotion
        run: |
          python -c "from backend.detection.bundles import resolve_active_bundle_dir; from backend.detection.integrity import validate_artifact_bundle; item = validate_artifact_bundle(resolve_active_bundle_dir()); assert item['production_approved'] is False and item['evaluation_only'] is True"

      - name: Validate ATT&CK snapshot and initialize isolated index
        run: |
          python -c "import json, os; from pathlib import Path; from backend.mitre.verification import verify_snapshot_index; result = verify_snapshot_index(Path(os.environ['RUNNER_TEMP']) / 'cyberguard-mitre-ci.sqlite'); assert result['technique_count'] > 0 and result['known_technique'] == 'T1498'; print(json.dumps(result, sort_keys=True))"
          test -z "$(find . -type f \( -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' \) -print -quit)"

      - name: Validate independent-data intake and report contracts with fixtures only
        run: python -m pytest -q tests/test_evaluation_intake.py tests/test_evaluation_report.py

      - name: Run unit and integration tests
        run: |
          python -m pytest -q
          test -z "$(find . -type f \( -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' \) -print -quit)"

      - name: Run repository verification gate
        run: python verify.py

      - name: Check Python syntax
        run: python -m compileall -q backend cyberguard tests verify.py

      - name: Set up Node.js for JavaScript syntax checks
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          for file in frontend/js/*.js; do
            node --check "$file"
          done

      - name: Check shell syntax
        run: bash -n run.sh run.bash cyberguard/setup.sh

      - name: Run Bandit
        run: python -m bandit -r backend cyberguard -x '*/tests/*' -f txt

      - name: Audit installed dependencies
        run: python -m pip_audit --local --progress-spinner off
